# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Archive
        run: |
          xcodebuild archive \
            -scheme ParticleFX \
            -destination 'platform=macOS'
            -archivePath build/ParticleFX.xcarchive
            -xcodebuild -exportArchive \
            -archivePath build/ParticleFX.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ExportOptions.plist

      - name: Create DMG
        run: |
          hdiutil create -volname "ParticleFX" \
            -srcfolder build/ParticleFX.app \
            -ov -format UDZO \
            build/ParticleFX.dmg

      - name: Publish to PFX-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            build/ParticleFX.dmg \
            --repo Boxer-egg/PFX-release \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}"
